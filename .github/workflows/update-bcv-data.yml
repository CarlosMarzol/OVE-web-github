name: Update OVE data

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Dataset group to update: daily, monthly, all, world-bank, or dataset id"
        required: true
        default: "daily"
  schedule:
    # Daily exchange-rate checks, Monday-Friday.
    - cron: "30 20 * * 1-5"
    # Monthly workbook catalogue refresh for PIB/INPC.
    - cron: "15 13 2 * *"
    # Weekly World Bank refresh.
    - cron: "20 12 * * 1"

permissions:
  contents: write

jobs:
  update-bcv-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select update group
        id: group
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "20 12 * * 1" ]; then
            echo "value=world-bank" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 13 2 * *" ]; then
            echo "value=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "value=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        run: python -m pip install --upgrade openpyxl pandas xlrd

      - name: Ingest data
        run: |
          if [ "${{ steps.group.outputs.value }}" = "world-bank" ]; then
            python scripts/world_bank_refresh.py
          else
            python scripts/bcv_ingest.py --group "${{ steps.group.outputs.value }}"
            if [ "${{ steps.group.outputs.value }}" = "monthly" ] || [ "${{ steps.group.outputs.value }}" = "all" ]; then
              python scripts/bcv_workbook_extract.py
            fi
          fi

      - name: Commit data changes
        run: |
          if git diff --quiet -- assets/data/bcv assets/data/world-bank; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bcv assets/data/world-bank
          git commit -m "Update OVE data"
          git push
