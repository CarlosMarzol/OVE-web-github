name: Update OVE data

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Dataset group to update: daily, monthly, all, world-bank, ilo, imf, fred, ine, cepal, unctad, or dataset id"
        required: true
        default: "daily"
  schedule:
    # Daily BCV exchange-rate refresh. GitHub Actions schedules run in UTC.
    - cron: "30 20 * * *"
    # Repeated monthly BCV workbook refresh for INPC/PIB, to catch late releases.
    - cron: "15 13 2,7,12,17,22 * *"
    # Weekly World Bank refresh.
    - cron: "20 12 * * 1"
    # Repeated monthly IMF WEO refresh for Venezuela macro indicators.
    - cron: "10 14 5,15,25 * *"
    # Weekly FRED refresh for Venezuela series exposed by the St. Louis Fed.
    - cron: "35 14 * * 2"
    # Weekly INE Venezuela resource catalog refresh.
    - cron: "55 14 * * 3"
    # Repeated monthly CEPALSTAT refresh for Venezuela indicators.
    - cron: "25 14 6,16,26 * *"
    # Repeated monthly UNCTADstat refresh for Venezuela reports.
    - cron: "45 14 8,18,28 * *"
    # Repeated monthly OIT/ILOSTAT refresh for Venezuela labor indicators.
    - cron: "40 13 3,10,17,24 * *"

permissions:
  contents: write

concurrency:
  group: ove-data-refresh
  cancel-in-progress: false

jobs:
  update-bcv-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select update group
        id: group
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 13 3,10,17,24 * *" ]; then
            echo "value=ilo" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 14 5,15,25 * *" ]; then
            echo "value=imf" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "35 14 * * 2" ]; then
            echo "value=fred" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "55 14 * * 3" ]; then
            echo "value=ine" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "25 14 6,16,26 * *" ]; then
            echo "value=cepal" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 14 8,18,28 * *" ]; then
            echo "value=unctad" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "20 12 * * 1" ]; then
            echo "value=world-bank" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 13 2,7,12,17,22 * *" ]; then
            echo "value=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "value=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        run: python -m pip install --upgrade openpyxl pandas pillow xlrd py7zr

      - name: Ingest data
        run: |
          if [ "${{ steps.group.outputs.value }}" = "world-bank" ]; then
            python scripts/world_bank_refresh.py
          elif [ "${{ steps.group.outputs.value }}" = "ilo" ]; then
            python scripts/ilo_refresh.py
          elif [ "${{ steps.group.outputs.value }}" = "imf" ]; then
            python scripts/imf_refresh.py
          elif [ "${{ steps.group.outputs.value }}" = "fred" ]; then
            python scripts/fred_refresh.py
          elif [ "${{ steps.group.outputs.value }}" = "ine" ]; then
            python scripts/ine_refresh.py
          elif [ "${{ steps.group.outputs.value }}" = "cepal" ]; then
            python scripts/cepal_refresh.py
          elif [ "${{ steps.group.outputs.value }}" = "unctad" ]; then
            python scripts/unctad_refresh.py
          elif [ "${{ steps.group.outputs.value }}" = "all" ]; then
            python scripts/bcv_ingest.py --group all
            python scripts/bcv_workbook_extract.py
            python scripts/world_bank_refresh.py
            python scripts/ilo_refresh.py
            python scripts/imf_refresh.py
            python scripts/fred_refresh.py
            python scripts/ine_refresh.py
            python scripts/cepal_refresh.py
            python scripts/unctad_refresh.py
          else
            python scripts/bcv_ingest.py --group "${{ steps.group.outputs.value }}"
            if [ "${{ steps.group.outputs.value }}" = "monthly" ]; then
              python scripts/bcv_workbook_extract.py
            fi
          fi
          python scripts/build_key_indicators_dataset.py

      - name: Commit data changes
        run: |
          if git diff --quiet -- assets/data/bcv assets/data/world-bank assets/data/ilo assets/data/imf assets/data/fred assets/data/ine assets/data/cepal assets/data/unctad assets/data/indicadores-clave; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/bcv assets/data/world-bank assets/data/ilo assets/data/imf assets/data/fred assets/data/ine assets/data/cepal assets/data/unctad assets/data/indicadores-clave
          git commit -m "Update OVE data"
          git push
